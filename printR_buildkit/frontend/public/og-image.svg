<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ECDC4"/>
      <stop offset="100%" style="stop-color:#7B68EE"/>
    </linearGradient>
    <linearGradient id="greenCandle" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- PrintR Text -->
  <text x="100" y="280" font-family="monospace" font-size="120" font-weight="bold" fill="url(#textGrad)">PrintR</text>

  <!-- Tagline -->
  <text x="100" y="340" font-family="sans-serif" font-size="28" fill="#ffffff" opacity="0.7">Live Arcade Financial Simulation</text>

  <!-- Candlestick chart -->
  <g transform="translate(700, 150)">
    <!-- Candle 1 -->
    <line x1="50" y1="80" x2="50" y2="200" stroke="#22c55e" stroke-width="3"/>
    <rect x="35" y="100" width="30" height="70" fill="url(#greenCandle)" rx="2"/>

    <!-- Candle 2 -->
    <line x1="110" y1="60" x2="110" y2="180" stroke="#22c55e" stroke-width="3"/>
    <rect x="95" y="80" width="30" height="60" fill="url(#greenCandle)" rx="2"/>

    <!-- Candle 3 -->
    <line x1="170" y1="40" x2="170" y2="160" stroke="#22c55e" stroke-width="3"/>
    <rect x="155" y="60" width="30" height="70" fill="url(#greenCandle)" rx="2"/>

    <!-- Candle 4 -->
    <line x1="230" y1="20" x2="230" y2="130" stroke="#22c55e" stroke-width="3"/>
    <rect x="215" y="40" width="30" height="60" fill="url(#greenCandle)" rx="2"/>

    <!-- Candle 5 -->
    <line x1="290" y1="50" x2="290" y2="150" stroke="#22c55e" stroke-width="3"/>
    <rect x="275" y="70" width="30" height="50" fill="url(#greenCandle)" rx="2"/>

    <!-- Trend line -->
    <polyline points="50,150 110,120 170,90 230,60 290,100" fill="none" stroke="#4ECDC4" stroke-width="3" stroke-dasharray="8,4"/>
  </g>

  <!-- Decorative pixels -->
  <rect x="100" y="400" width="12" height="12" fill="#4ECDC4" opacity="0.6"/>
  <rect x="130" y="420" width="12" height="12" fill="#7B68EE" opacity="0.5"/>
  <rect x="160" y="390" width="12" height="12" fill="#FF6B9D" opacity="0.7"/>

  <rect x="1050" y="100" width="16" height="16" fill="#FFD700" opacity="0.6"/>
  <rect x="1080" y="130" width="12" height="12" fill="#4ECDC4" opacity="0.5"/>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#000000" opacity="0.3"/>
  <text x="100" y="615" font-family="sans-serif" font-size="20" fill="#ffffff" opacity="0.6">Kreation Studios / BuidLer Labs</text>
  <text x="1000" y="615" font-family="sans-serif" font-size="20" fill="#4ECDC4">Solana VRF</text>
</svg>
