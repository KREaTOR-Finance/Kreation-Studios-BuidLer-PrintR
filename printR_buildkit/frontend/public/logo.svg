<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B68EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#1a1a2e"/>
  <!-- P letter - pixel style -->
  <g fill="url(#logoGrad)" filter="url(#glow)">
    <!-- P vertical bar -->
    <rect x="28" y="24" width="16" height="80" rx="2"/>
    <!-- P top horizontal -->
    <rect x="44" y="24" width="32" height="16" rx="2"/>
    <!-- P middle horizontal -->
    <rect x="44" y="48" width="32" height="16" rx="2"/>
    <!-- P right vertical (top part) -->
    <rect x="68" y="32" width="16" height="24" rx="2"/>
  </g>
  <!-- Decorative pixels -->
  <rect x="96" y="24" width="8" height="8" fill="#4ECDC4" opacity="0.8"/>
  <rect x="104" y="32" width="8" height="8" fill="#7B68EE" opacity="0.6"/>
  <rect x="96" y="88" width="8" height="8" fill="#FF6B9D" opacity="0.7"/>
  <rect x="16" y="96" width="8" height="8" fill="#4ECDC4" opacity="0.5"/>
</svg>
